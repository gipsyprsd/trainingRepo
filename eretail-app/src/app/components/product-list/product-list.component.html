<div class="container my-4">
  <div class="row mb-4">
    <div class="col-12">
      <h2>Our Products</h2>
      <p class="text-muted">Discover our amazing collection of products</p>
    </div>
  </div>

  <!-- Category Filter -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex flex-wrap gap-2">
        <button 
          *ngFor="let category of categories"
          class="btn"
          [class.btn-primary]="selectedCategory === category"
          [class.btn-outline-primary]="selectedCategory !== category"
          (click)="onCategoryChange(category)">
          {{ category }}
        </button>
      </div>
    </div>
  </div>

  <!-- Products Grid -->
  <div class="row">
    <div class="col-lg-3 col-md-4 col-sm-6 mb-4" *ngFor="let product of filteredProducts">
      <app-product-card [product]="product"></app-product-card>
    </div>
  </div>

  <!-- No products message -->
  <div class="row" *ngIf="filteredProducts.length === 0">
    <div class="col-12">
      <div class="text-center py-5">
        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">No products found</h4>
        <p class="text-muted">Try selecting a different category</p>
      </div>
    </div>
  </div>
</div>
