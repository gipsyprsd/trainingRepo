<div class="card product-card h-100" *ngIf="product">
  <img [src]="product.imageUrl" [alt]="product.name" class="card-img-top" style="height: 200px; object-fit: cover;">
  
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.name }}</h5>
    <p class="card-text text-muted small">{{ product.description }}</p>
    
    <div class="mb-2">
      <span class="badge bg-secondary">{{ product.category }}</span>
    </div>
    
    <div class="mb-2">
      <span *ngFor="let star of generateStars(product.rating)" [class]="star + ' text-warning'"></span>
      <small class="text-muted ms-2">({{ product.reviews }} reviews)</small>
    </div>
    
    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center">
        <h4 class="text-primary mb-0">${{ product.price | number:'1.2-2' }}</h4>
        <button 
          class="btn btn-primary" 
          [disabled]="!product.inStock"
          (click)="addToCart()">
          <i class="fas fa-cart-plus me-1"></i>
          {{ product.inStock ? 'Add to Cart' : 'Out of Stock' }}
        </button>
      </div>
    </div>
  </div>
</div>
